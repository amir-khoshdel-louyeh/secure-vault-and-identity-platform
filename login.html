<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Secure Vault Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Main Header -->
        <header>
            <h1>Secure Vault & Identity Platform</h1>
        </header>

        <!-- Authentication Section -->
        <section id="auth-section">
            <div class="auth-box">
                <!-- Login Form -->
                <div class="auth-form">
                    <h3>Sign In</h3>
                    <form id="login-form">
                        <div class="form-group">
                            <label for="login-username">Username:</label>
                            <input type="text" id="login-username" name="username" required autocomplete="username">
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password:</label>
                            <input type="password" id="login-password" name="password" required autocomplete="current-password">
                        </div>
                        <div class="form-group">
                            <label for="login-totp">Two-Factor Code (TOTP):</label>
                            <input type="text" id="login-totp" name="totp_code" placeholder="6-digit auth code" maxlength="6" autocomplete="off">
                        </div>
                        <button type="submit" class="btn-primary">Sign In</button>
                    </form>
                </div>

                <div class="auth-divider"></div>

                <!-- Registration Form -->
                <div class="auth-form">
                    <h3>Create Account</h3>
                    <form id="register-form">
                        <div class="form-group">
                            <label for="reg-username">Username:</label>
                            <input type="text" id="reg-username" name="username" required autocomplete="username">
                        </div>
                        <div class="form-group">
                            <label for="reg-email">Email:</label>
                            <input type="email" id="reg-email" name="email" required autocomplete="email">
                        </div>
                        <div class="form-group">
                            <label for="reg-password">Password:</label>
                            <input type="password" id="reg-password" name="password" required autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn-secondary">Register</button>
                    </form>
                </div>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
