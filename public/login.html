<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">
    <title>Login - Secure Vault Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <!-- Main Header -->
        <header>
            <h1>Secure Vault & Identity Platform</h1>
            <div style="display:flex;gap:10px;align-items:center;">
                <a href="index.html" class="btn-secondary" style="text-decoration:none;">Welcome Page</a>
                <a href="register.html" class="btn-primary" style="text-decoration:none;">Create Account</a>
            </div>
        </header>

        <!-- Login Section -->
        <section id="auth-section">
            <div class="auth-single">
                <div class="auth-form">
                    <h3>Sign In</h3>
                    
                    <!-- Alert Message Area -->
                    <div id="login-alert" class="alert alert-danger" style="display: none;"></div>

                    <!-- STEP 1: Username & Password -->
                    <form id="login-step1-form">
                        <div class="form-group">
                            <label for="login-username">Username:</label>
                            <input type="text" id="login-username" name="username" required autocomplete="username">
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password:</label>
                            <input type="password" id="login-password" name="password" required autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn-primary" style="width:100%;">Next</button>
                    </form>

                    <!-- STEP 2: TOTP Authentication (Hidden by default, shown if 2FA is enabled) -->
                    <form id="login-step2-form" style="display: none;">
                        <input type="hidden" id="login-temp-token" name="temp_token">
                        
                        <div class="form-group">
                            <label for="login-totp">Two-Factor Authenticator Code (TOTP):</label>
                            <input type="text" id="login-totp" name="totp_code" placeholder="6-digit code" maxlength="6" pattern="\d{6}" autocomplete="one-time-code">
                        </div>
                        
                        <button type="submit" class="btn-primary" style="width:100%;">Verify & Sign In</button>
                        
                        <div class="form-sub-actions" style="margin-top:12px;text-align:center;">
                            <button type="button" id="toggle-recovery-btn" class="btn-link">Use Recovery Code instead</button>
                        </div>
                    </form>

                    <!-- STEP 2 ALTERNATIVE: Account Recovery via Backup Code -->
                    <form id="login-recovery-form" style="display: none;">
                        <input type="hidden" id="recovery-temp-token" name="temp_token">
                        
                        <div class="form-group">
                            <label for="recovery-code">Recovery / Backup Code:</label>
                            <input type="text" id="recovery-code" name="recovery_code" placeholder="Enter your backup code" autocomplete="off" required>
                        </div>
                        
                        <button type="submit" class="btn-warning" style="width:100%;background-color:var(--warning-color);color:#fff;">Recover Account & Sign In</button>
                        
                        <div class="form-sub-actions" style="margin-top:12px;text-align:center;">
                            <button type="button" id="back-to-totp-btn" class="btn-link">Back to 2FA Code</button>
                        </div>
                    </form>
                </div>

                <div class="auth-switch">
                    Don't have an account? <a href="register.html">Create one</a> • <a href="index.html">Back to Welcome Page</a>
                </div>
            </div>
        </section>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
